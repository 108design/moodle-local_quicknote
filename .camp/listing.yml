# Example .camp/listing.yml — lives in the PLUGIN's repository, not the index
# (RFC §4.1). Authors update their listing with an ordinary commit; camp
# ingests and hash-pins it at each tagged release. This example is what the
# release tooling would scaffold for mod_cmi5launch.

name: QuickNote
summary: Help students study better without leaving Moodle. QuickNote lets learners capture quotes, write notes in a native sidebar, and jump right back to the original text.
description: |
  Designed for the native Boost experience in Moodle 4.4 and 4.5+, QuickNote helps students capture
  important excerpts while reading course materials, connect those excerpts to personal reflections,
  and return to the exact place where learning happened.

  Instead of forcing learners to copy text into external apps, QuickNote keeps the study workflow inside Moodle.
  Students can highlight a passage, save it instantly as a quote, add their own interpretation, and revisit the
  original context later through browser text-fragment navigation.

  - Granular Control: Advanced settings for admins and teachers to control visibility per course or page.
  - Highlight to Note: Save selections instantly as quotes.
  - Scroll to Text Fragments: Return users to the exact original passage and highlight it visually.
  - Native Sidebar Drawer: Notes are managed inside a right-hand sidebar drawer integrated with Boost.
  - Notes Center: Dedicated dashboard to view, search, and filter notes across courses.
  - PDF & Markdown Export: Export compiled notes directly from the Notes Center.
  - Auto-save & Core Safety: Background saving, Backup & Restore support, and auto-deletion on unenrollment.
labels:
  - fully-free
category: local
